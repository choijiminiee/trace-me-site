<svg xmlns="http://www.w3.org/2000/svg" width="600" height="572" viewBox="0 0 600 572"><defs><radialGradient id="glow" cx="0" cy="0" r="1"><stop stop-color="#5940ae" stop-opacity=".5"/><stop offset=".35" stop-color="#1a777c" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="598" height="570" rx="22" fill="#050505" stroke="#777"/><rect x="2" y="2" width="596" height="160" rx="21" fill="url(#glow)"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="34" y="65" font-size="26" fill="#eee" font-weight="600" text-anchor="start">키워드 변화</text><text x="34" y="101" font-size="17" fill="#aaa" font-weight="400" text-anchor="start">이전의 나와 현재의 나는 이렇게 달라졌어요.</text><text x="139" y="176" font-size="17" fill="#aaa" font-weight="400" text-anchor="middle">이전의 나 (1월–3월)</text><text x="447" y="176" font-size="17" fill="#aaa" font-weight="400" text-anchor="middle">현재의 나 (4월–6월)</text><rect x="25" y="218" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="61" y="248" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 혼자</text><rect x="103" y="218" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="139" y="248" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 불안</text><rect x="181" y="218" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="217" y="248" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 지침</text><rect x="25" y="288" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="61" y="318" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 집중</text><rect x="103" y="288" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="139" y="318" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 무기력</text><rect x="342" y="218" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="378" y="248" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 성장</text><rect x="420" y="218" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="456" y="248" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 사랑</text><rect x="342" y="288" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="378" y="318" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 긍정적</text><rect x="420" y="288" width="72" height="48" rx="12" fill="#191420" stroke="#51405e"/><text x="456" y="318" font-size="15" fill="#bc8cde" font-weight="400" text-anchor="middle"># 활력있는</text><text x="299" y="300" font-size="42" fill="#aaa" font-weight="400" text-anchor="middle">→</text><rect x="95" y="460" width="440" height="65" rx="16" fill="none" stroke="#ddd"/><text x="120" y="500" font-size="17" fill="#bb83e3" font-weight="400" text-anchor="start">가장 많이 등장한 키워드</text><text x="358" y="504" font-size="32" fill="#aaa" font-weight="400" text-anchor="start">→</text><text x="423" y="504" font-size="31" fill="#bb83e3" font-weight="400" text-anchor="start">성장</text></g></svg>